[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobreach"
version = "0.1.0"
description = "Local-first CLI for AI-assisted cold job outreach over Gmail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Areesh Ali", email = "areesh.192003@gmail.com" }]
keywords = ["cli", "email", "job-search", "gmail", "outreach"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "typer",
  "pydantic",
  "pandas",
  "rich",
  "python-dotenv",
  "keyring",
  "prompt_toolkit",
  "InquirerPy",
  "pypdf",
  "python-docx",
  "email-validator",
  "jinja2",
  "langchain",
  "langchain-core",
  "langchain-openai",
  "langchain-google-genai",
  "langchain-anthropic",
  "google-api-python-client",
  "google-auth",
  "google-auth-oauthlib",
  "google-auth-httplib2",
  "google-generativeai",
  "openai",
  "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine", "ruff"]

[project.scripts]
jobreach = "jobreach.cli:main"

[project.urls]
Homepage = "https://github.com/https-404/Email-Reachout-Cli"
Repository = "https://github.com/https-404/Email-Reachout-Cli"
Issues = "https://github.com/https-404/Email-Reachout-Cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobreach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
